<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles/ask.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Coming+Soon&display=swap"
            rel="stylesheet"
        />
        <title>Домашнее задание 1</title>
    </head>
    <body>
        <header>
            <div class="logo">AskNagdasev</div>
            <div class="search">
                <input type="text" name="search" placeholder="search" />
                <button class="search-button">ASK!</button>
            </div>
            <div class="profile">
                <div class="avatar"></div>
                <div class="profile-info">
                    <p>FIO</p>
                    <div class="profile-actions">
                        <a href="#">settings</a>
                        <a href="#">logout</a>
                    </div>
                </div>
            </div>
        </header>
        <main>
            <div class="main-container">
                <h2>New Question</h2>
                <div class="question-title">
                    <p>Title</p>
                    <input type="text" />
                </div>
                <div class="question-text">
                    <p>Text</p>
                    <textarea></textarea>
                </div>
                <div class="question-tags">
                    <p>Tags</p>
                    <input type="text" />
                </div>
                <button class="ask-btn">ASK!</button>
            </div>
            <aside>
                <div class="tags-container">
                    <h3>Popular Tags</h3>
                    <div class="tags">
                        <a href="#">perl</a>
                        <a href="#" class="text-red">python</a>
                        <a href="#">TechnoPark</a>
                        <a href="#" class="text-red">MySQL</a>
                        <a href="#" class="text-green">django</a>
                        <a href="#">Mail.Ru</a>
                        <a href="#">Voloshin</a>
                        <a href="#" class="text-orange">Firefox</a>
                    </div>
                </div>
                <div class="members-container">
                    <h3>Best Members</h3>
                    <div class="members">
                        <a href="#">Mr. Freeman</a>
                        <a href="#">Dr. House</a>
                        <a href="#">Bender</a>
                        <a href="#">Queen Victoria</a>
                        <a href="#">V. Pupkin</a>
                    </div>
                </div>
            </aside>
        </main>
    </body>
</html>
