<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coming+Soon&display=swap" rel="stylesheet">
    <title>Домашнее задание 1</title>
    <style>
        :root {
            --primary_green: #49fe8c;
        }
        
        body {
            font-family: 'Coming Soon', cursive;
        }
        
        .navbar {
            background-color: lightskyblue;
            border-bottom: 1px solid gray;
        }
        
        .search-button {
            background-color: var(--primary_green);
            border: none;
            color: white;
            box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 0.8);
        }
        
        .text-red { color: red; }
        .text-green { color: green; }
        .text-orange { color: orange; }
        
        .ask-btn {
            background-color: white;
            border: 1px solid black;
            box-shadow: 2px 2px 4px;
        }
    </style>
</head>
<body>
    <header class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <div class="navbar-brand fw-bold fs-3">AskNagdasev</div>
            
            <div class="d-flex flex-grow-1 mx-3">
                <input type="text" class="form-control me-2" placeholder="search">
                <button class="btn search-button">ASK!</button>
            </div>
            
            <div class="d-flex align-items-center">
                <div class="border border-dark rounded-circle me-2" style="width: 40px; height: 40px;"></div>
                <div>
                    <p class="mb-0">FIO</p>
                    <div class="d-flex gap-2">
                        <a href="#" class="text-decoration-none">settings</a>
                        <a href="#" class="text-decoration-none">logout</a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <main class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-9">
                <div class="px-3">
                    <h2 class="mb-3">New Question</h2>
                    
                    <div class="mb-3 row">
                        <label class="col-sm-1 col-form-label">Title</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control">
                        </div>
                    </div>
                    
                    <div class="mb-3 row">
                        <label class="col-sm-1 col-form-label">Text</label>
                        <div class="col-sm-8">
                            <textarea class="form-control" rows="5"></textarea>
                        </div>
                    </div>
                    
                    <div class="mb-3 row">
                        <label class="col-sm-1 col-form-label">Tags</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control">
                        </div>
                    </div>
                    
                    <button class="btn ask-btn ms-5">ASK!</button>
                </div>
            </div>
            
            <aside class="col-md-3">
                <div class="mb-5">
                    <h3>Popular Tags</h3>
                    <div class="d-flex flex-wrap gap-3 mt-2">
                        <a href="#" class="text-decoration-none">perl</a>
                        <a href="#" class="text-decoration-none text-red">python</a>
                        <a href="#" class="text-decoration-none">TechnoPark</a>
                        <a href="#" class="text-decoration-none text-red">MySQL</a>
                        <a href="#" class="text-decoration-none text-green">django</a>
                        <a href="#" class="text-decoration-none">Mail.Ru</a>
                        <a href="#" class="text-decoration-none">Voloshin</a>
                        <a href="#" class="text-decoration-none text-orange">Firefox</a>
                    </div>
                </div>
                
                <div>
                    <h3>Best Members</h3>
                    <div class="d-flex flex-column gap-2 mt-2">
                        <a href="#" class="text-decoration-none">Mr. Freeman</a>
                        <a href="#" class="text-decoration-none">Dr. House</a>
                        <a href="#" class="text-decoration-none">Bender</a>
                        <a href="#" class="text-decoration-none">Queen Victoria</a>
                        <a href="#" class="text-decoration-none">V. Pupkin</a>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
